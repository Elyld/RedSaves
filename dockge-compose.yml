# ── RedSaves for Dockge ──────────────────────────────────────────────
# Copy this whole file into a new Dockge stack, then fill in the
# Environment section below (same variable names as the old .env file).
# Updating later is just: pull the new image + redeploy.
services:
  redsaves:
    image: ghcr.io/elyld/redsaves:latest
    container_name: redsaves
    ports:
      - "4003:8000"
    environment:
      - TZ=America/Chicago
      # --- Reddit API ---
      - CLIENT_ID=
      - SECRET_TOKEN=
      - REFRESH_TOKEN=
      - REDDIT_USERNAME=
      # --- MyJDownloader ---
      - EMAIL=
      - PASSWORD=
      - DEVICE_NAME=
      - DESTINATION_FOLDER=
      # --- Pushover ---
      - PUSHOVER_USER_KEY=
      - PUSHOVER_API_TOKEN=
      # --- Local media (v2.11.0): where JDownloader downloads live on the
      # host, so the media center can play files from disk (bypasses regional
      # blocks). Mount it read-only and point MEDIA_DIR at the mount.
      - MEDIA_DIR=/downloads
    volumes:
      - redsaves-data:/data
      - /path/to/your/downloads:/downloads:ro
    restart: unless-stopped

volumes:
  redsaves-data:
