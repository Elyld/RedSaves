name: RedSaves Metadata
description: Fills scene metadata (title, performer, tags, URL, rating) from your RedSaves library when new scenes are scanned. Never touches files — metadata only.
version: 1.0.0
url: https://github.com/Elyld/RedSaves

interface: raw

exec:
  - python3
  - "{pluginDir}/redsaves.py"

settings:
  redsaves_url:
    displayName: RedSaves URL
    description: Base URL of RedSaves as seen from the Stash server, e.g. http://192.168.1.10:4003 (use the Unraid IP — localhost only works if RedSaves runs on the same machine as Stash)
    type: STRING
  api_key:
    displayName: Stash API key (optional)
    description: Only needed if your Stash requires API key authentication
    type: STRING
  dry_run:
    displayName: Dry run
    description: Log what would change without applying it
    type: BOOLEAN
    default: false

hooks:
  - name: Tag new scenes from RedSaves
    description: On every new scene, look the file up in RedSaves and fill in its metadata
    triggeredBy:
      - Scene.Create.Post

tasks:
  - name: Backfill from RedSaves
    description: Fill metadata for existing scenes missing the RedSaves tag
    defaultArgs:
      mode: backfill
